# yaml-language-server: $schema=https://taskfile.dev/schema.json
---
version: "3"

set:
  - pipefail

run: once

vars:
  ESP_PORT: '{{.ESP_PORT | default "/dev/cu.usbserial-0001"}}'

env:
  ATMOSMESH_VENV: '{{.AGENT_VENV | default ""}}'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list
    silent: true

  bootstrap-agent-python:
    desc: Create a host venv and install pyserial + esptool
    cmds:
      - "{{.ROOT_DIR}}/scripts/with-agent-python --bootstrap"

  test:
    desc: Host Unity tests (`pio test -e native`)
    dir: firmware
    cmds:
      - "{{.ROOT_DIR}}/scripts/with-agent-python pio test -e native"

  build-v1:
    desc: Build AtmosMesh v1 for ESP32 (`pio run -e atmosmesh-v1`)
    dir: firmware
    cmds:
      - "{{.ROOT_DIR}}/scripts/gen-secrets-from-env"
      - "{{.ROOT_DIR}}/scripts/with-agent-python pio run -e atmosmesh-v1"

  build-v1-5:
    desc: Build AtmosMesh Grove v1.5 (`pio run -e atmosmesh-grove-v1_5`)
    dir: firmware
    cmds:
      - "{{.ROOT_DIR}}/scripts/with-agent-python pio run -e atmosmesh-grove-v1_5"

  build-all:
    desc: Build every first-class AtmosMesh firmware product
    cmds:
      - task: build-v1
      - task: build-v1-5

  build:
    desc: Compatibility alias for build-v1 (AtmosMesh v1 / ESP32)
    cmds:
      - task: build-v1

  build-grove:
    desc: Compatibility alias for build-v1-5 (AtmosMesh Grove v1.5)
    cmds:
      - task: build-v1-5

  flash-v1:
    desc: Upload AtmosMesh v1 to ESP_PORT (default /dev/cu.usbserial-0001)
    dir: firmware
    cmds:
      - "{{.ROOT_DIR}}/scripts/gen-secrets-from-env"
      - "{{.ROOT_DIR}}/scripts/with-agent-python pio run -e atmosmesh-v1 -t upload --upload-port {{.ESP_PORT}}"

  flash-v1-5:
    desc: Upload Grove v1.5 to ESP_PORT; replaces installed AT firmware; use reviewed image only
    dir: firmware
    cmds:
      - "{{.ROOT_DIR}}/scripts/with-agent-python pio run -e atmosmesh-grove-v1_5 -t upload --upload-port {{.ESP_PORT}}"

  flash:
    desc: Compatibility alias for flash-v1
    cmds:
      - task: flash-v1

  flash-grove:
    desc: Compatibility alias for flash-v1-5
    cmds:
      - task: flash-v1-5

  monitor-v1:
    desc: Serial monitor for AtmosMesh v1 at 115200 on ESP_PORT
    dir: firmware
    cmds:
      - "{{.ROOT_DIR}}/scripts/with-agent-python pio device monitor --port {{.ESP_PORT}} --baud 115200"

  monitor-v1-5:
    desc: Serial monitor for AtmosMesh Grove v1.5 at 115200 on ESP_PORT
    dir: firmware
    cmds:
      - "{{.ROOT_DIR}}/scripts/with-agent-python pio device monitor --port {{.ESP_PORT}} --baud 115200"

  monitor:
    desc: Compatibility alias for monitor-v1
    cmds:
      - task: monitor-v1

  monitor-grove:
    desc: Compatibility alias for monitor-v1-5
    cmds:
      - task: monitor-v1-5

  run:
    desc: Flash then open the serial monitor
    cmds:
      - task: flash
      - task: monitor

  flash-monitor:
    desc: Flash then open the serial monitor
    cmds:
      - task: run

  check:
    desc: Whitespace and conflict-marker check (`git diff --check`)
    cmds:
      - git diff --check

  clean-v1:
    desc: Clean AtmosMesh v1 build artifacts
    dir: firmware
    cmds:
      - "{{.ROOT_DIR}}/scripts/with-agent-python pio run -e atmosmesh-v1 -t clean"

  clean-v1-5:
    desc: Clean AtmosMesh Grove v1.5 build artifacts
    dir: firmware
    cmds:
      - "{{.ROOT_DIR}}/scripts/with-agent-python pio run -e atmosmesh-grove-v1_5 -t clean"

  clean:
    desc: Compatibility alias for clean-v1
    cmds:
      - task: clean-v1

  clean-grove:
    desc: Compatibility alias for clean-v1-5
    cmds:
      - task: clean-v1-5
