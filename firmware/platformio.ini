; PlatformIO project for AtmosMesh firmware.
; Native env: host Unity tests (no hardware).
; Canonical products: atmosmesh-v1, atmosmesh-grove-v1_5, and atmosmesh-aqua-v1.
; Compatibility environments: esp32dev and esp8266-grove.

[platformio]
src_dir = src
include_dir = include
test_dir = test
default_envs = native

[env]
build_unflags = -std=gnu++11
; OLED: 0=SSD1306 (default 128×64 sequential COM / U8g2 ALT0). 1=SH1106 compile fallback.
; Height: 64 (default ALT0). Do not send mux 0x2F. 32=Univision is not the default.
; Flip: ATMOSMESH_OLED_FLIP=1 if COM is inverted (upper RAM on the lower glass). Default 0.
build_flags =
    -std=gnu++17
    -Iinclude
    -Wall
    -Wextra
    -DATMOSMESH_OLED_FLIP=0

[env:native]
platform = native
test_framework = unity
test_build_src = true
build_src_filter =
    +<*>
    -<products/*>
    -<i2c_bus.cpp>
    -<mqtt_runtime.cpp>
    -<grove_mqtt_runtime.cpp>
    -<aqua_mqtt_runtime.cpp>

[env:atmosmesh-v1]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = time
upload_speed = 115200
lib_deps =
    olikraus/U8g2@2.36.15
    adafruit/DHT sensor library@1.4.6
    adafruit/Adafruit Unified Sensor@1.1.15
    adafruit/Adafruit BMP280 Library@2.6.8
    adafruit/Adafruit BusIO@1.17.4
    adafruit/Adafruit VEML7700 Library@2.1.6
build_src_filter =
    +<*>
    -<products/*>
    -<grove_mqtt_runtime.cpp>
    -<aqua_mqtt_runtime.cpp>
    -<grove_visual_diagnostic.cpp>
    +<products/atmosmesh_v1.cpp>

[env:atmosmesh-grove-v1_5]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
monitor_speed = 115200
monitor_filters = time
upload_speed = 115200
lib_deps =
    olikraus/U8g2@2.36.15
    adafruit/DHT sensor library@1.4.6
    adafruit/Adafruit Unified Sensor@1.1.15
    adafruit/Adafruit BMP085 Library@1.2.4
    adafruit/Adafruit BusIO@1.17.4
    knolleary/PubSubClient@2.8.0
build_src_filter =
    -<*>
    +<products/atmosmesh_grove_v1_5.cpp>
    +<grove_status.cpp>
    +<grove_visual_diagnostic.cpp>
    +<rc_light.cpp>
    +<soil_sampler.cpp>
    +<soil_status.cpp>
    +<status_led.cpp>
    +<mqtt_contract.cpp>
    +<mqtt_session.cpp>
    +<grove_mqtt_runtime.cpp>

[env:atmosmesh-aqua-v1]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
monitor_speed = 115200
monitor_filters = time
upload_speed = 115200
lib_deps =
    olikraus/U8g2@2.36.15
    knolleary/PubSubClient@2.8.0
build_src_filter =
    -<*>
    +<products/atmosmesh_aqua_v1.cpp>
    +<aqua_status.cpp>
    +<sht4x_frame.cpp>
    +<soil_sampler.cpp>
    +<mqtt_contract.cpp>
    +<mqtt_session.cpp>
    +<aqua_mqtt_runtime.cpp>

; Explicit temporary operator image: holds the logical 128x32 OLED framebuffer ON and cycles the
; polarity-aware bi-color LED. The canonical Grove environment keeps its live display/health LED.
[env:atmosmesh-grove-v1_5-visual-diagnostic]
extends = env:atmosmesh-grove-v1_5
build_flags =
    ${env.build_flags}
    -DATMOSMESH_GROVE_VISUAL_DIAGNOSTIC=1

; Alternative hardware verification profile. Installed Grove hardware is common-anode.
[env:atmosmesh-grove-v1_5-common-cathode]
extends = env:atmosmesh-grove-v1_5
build_flags =
    ${env.build_flags}
    -DATMOSMESH_GROVE_LED_COMMON_ANODE=0

; Compatibility aliases retained for existing operator and CI workflows.
[env:esp32dev]
extends = env:atmosmesh-v1

[env:esp8266-grove]
extends = env:atmosmesh-grove-v1_5
