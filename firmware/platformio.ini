; PlatformIO project for AtmosMesh firmware.
; Native env: host Unity tests (no hardware).
; esp32dev: ESP32-WROOM-32 DevKit (CP2102 USB-UART).

[platformio]
src_dir = src
include_dir = include
test_dir = test
default_envs = native

[env]
build_unflags = -std=gnu++11
; OLED: 0=SSD1306 128×32 Univision (default). 1=SH1106 compile fallback (2-pixel offset).
; Height: 32 (default) or 64 (ALT0 sequential COM). Example: -DATMOSMESH_OLED_HEIGHT=64
build_flags =
    -std=gnu++17
    -Iinclude
    -Wall
    -Wextra

[env:native]
platform = native
test_framework = unity
test_build_src = true
build_src_filter =
    +<*>
    -<main.cpp>
    -<i2c_bus.cpp>

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = time
upload_speed = 115200
lib_deps =
    olikraus/U8g2@2.36.15
    adafruit/DHT sensor library@1.4.6
    adafruit/Adafruit Unified Sensor@1.1.15
    adafruit/Adafruit BMP280 Library@2.6.8
    adafruit/Adafruit BusIO@1.17.4
build_src_filter =
    +<*>
