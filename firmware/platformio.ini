; PlatformIO project for AtmosMesh firmware.
; Native env: host Unity tests (no hardware).
; esp32dev: ESP32-WROOM-32 DevKit (CP2102 USB-UART).

[platformio]
src_dir = src
include_dir = include
test_dir = test
default_envs = native

[env]
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Iinclude
    -Wall
    -Wextra

[env:native]
platform = native
test_framework = unity
test_build_src = true
build_src_filter =
    +<*>
    -<main.cpp>
    -<lcd_bus.cpp>

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = time
upload_speed = 115200
lib_deps =
    marcoschwartz/LiquidCrystal_I2C@1.1.4
    adafruit/DHT sensor library@1.4.6
    adafruit/Adafruit Unified Sensor@1.1.15
build_src_filter =
    +<*>
