; PlatformIO project for AtmosMesh firmware.
; Native env: host Unity tests (no hardware).
; esp32dev: ESP32-WROOM-32 DevKit (CP2102 USB-UART).

[platformio]
src_dir = src
include_dir = include
test_dir = test
default_envs = native

[env]
build_unflags = -std=gnu++11
; OLED: 0=SSD1306 (default 128×64 sequential COM / U8g2 ALT0). 1=SH1106 compile fallback.
; Height: 64 (default ALT0). Do not send mux 0x2F. 32=Univision is not the default.
; Flip: ATMOSMESH_OLED_FLIP=1 if COM is inverted (upper RAM on the lower glass). Default 0.
build_flags =
    -std=gnu++17
    -Iinclude
    -Wall
    -Wextra
    -DATMOSMESH_OLED_FLIP=0

[env:native]
platform = native
test_framework = unity
test_build_src = true
build_src_filter =
    +<*>
    -<main.cpp>
    -<i2c_bus.cpp>

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = time
upload_speed = 115200
lib_deps =
    olikraus/U8g2@2.36.15
    adafruit/DHT sensor library@1.4.6
    adafruit/Adafruit Unified Sensor@1.1.15
    adafruit/Adafruit BMP280 Library@2.6.8
    adafruit/Adafruit BusIO@1.17.4
    adafruit/Adafruit VEML7700 Library@2.1.6
build_src_filter =
    +<*>
