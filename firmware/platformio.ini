; PlatformIO project for AtmosMesh firmware.
; Native env: host Unity tests (no hardware).
; esp32dev: ESP32-WROOM-32 DevKit (CP2102 USB-UART).

[platformio]
src_dir = src
include_dir = include
test_dir = test
default_envs = native

[env]
build_unflags = -std=gnu++11
; OLED: 1=SH1106 (default, 2-pixel offset), 0=SSD1306 sequential COM compile fallback.
; Height: 64 (default) or 32. Example: -DATMOSMESH_OLED_CONTROLLER_ID=0 -DATMOSMESH_OLED_HEIGHT=32
build_flags =
    -std=gnu++17
    -Iinclude
    -Wall
    -Wextra

[env:native]
platform = native
test_framework = unity
test_build_src = true
build_src_filter =
    +<*>
    -<main.cpp>
    -<i2c_bus.cpp>

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = time
upload_speed = 115200
lib_deps =
    adafruit/Adafruit SSD1306@2.5.13
    adafruit/Adafruit SH110X@2.1.12
    adafruit/Adafruit GFX Library@1.11.11
    adafruit/DHT sensor library@1.4.6
    adafruit/Adafruit Unified Sensor@1.1.15
build_src_filter =
    +<*>
