; Throwaway I2C scanner for the ESP32-C3 SuperMini OLED board (AtmosMesh SP-01 bring-up).
; Standalone PlatformIO project: run `pio run -t upload` and `pio device monitor` from this directory.
; The real product env lands in firmware/platformio.ini with SP-02.
[env:c3scan]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
board_build.flash_mode = dio
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
