# CI

name: firmware

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install "platformio==6.1.19"
      - name: Native Unity tests
        run: pio test -e native
