# Dependabot version updates.
# Alerts + security updates are enabled on the GitHub repo (Settings → Code security).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: ":arrow_up:"
      include: scope

  - package-ecosystem: pip
    directory: /firmware
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: ":arrow_up:"
      include: scope
